name: Godot project tests

on:
  push:
    paths:
      - '**'
      - '.github/workflows/godot-test.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/godot-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-smoke-test:
    name: Import project and run main-scene smoke test (no APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.3'
    steps:
      - name: Checkout Godot game project
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import resources and test the actual game scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          timeout 25s godot --headless --path . --quit-after 8 2>&1 | tee smoke.log
          grep -q 'PIZZERIA_FREE_SCENE_READY' smoke.log
          grep -q 'PIZZERIA_CORRIDORS_V2_READY' smoke.log
          grep -q 'CC0_FURNITURE_LOADED tables=10 chairs=20' smoke.log
          grep -q 'OPTIONAL_CCTV_FILTER_READY' smoke.log
          grep -q 'MIMIC_MODEL_LOADED' smoke.log
          grep -q 'GAME_AUDIO_ASSETS_LOADED' smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid get index|MIMIC_GLB_LOAD_FAILED|MIMIC_MODEL_HAS_NO_MESHES|GAME_AUDIO_ASSETS_MISSING' smoke.log; then
            echo 'Godot main scene smoke test reported a script/runtime error.'
            exit 1
          fi

      - name: Package Godot project for visual review (no APK)
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$RUNNER_TEMP/EcosDelUmbral-project-review.zip" . \
            -x './.git/*' './.godot/*' './build/*' './.import/*'
          test -s "$RUNNER_TEMP/EcosDelUmbral-project-review.zip"
          unzip -t "$RUNNER_TEMP/EcosDelUmbral-project-review.zip"

      - name: Upload reviewable Godot project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EcosDelUmbral-project-review
          path: ${{ runner.temp }}/EcosDelUmbral-project-review.zip
          if-no-files-found: error
          retention-days: 30
